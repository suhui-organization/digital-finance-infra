worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ============================================================
    # 后端 API upstream (Docker 容器名，自动 DNS 解析)
    # ============================================================
    upstream go-backend {
        server go-backend:16080;
    }

    upstream ai-service {
        server ai-service:8001;
    }

    # ============================================================
    # API Gateway — admin 和 mobile 统一通过此网关访问后端
    # ============================================================
    server {
        listen 80;
        server_name _;

        # CORS — 允许 admin(16010) 和 mobile(16020) 跨域访问
        # always: 对 4xx/5xx 错误响应也添加 CORS 头，确保前端能读取错误信息
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ============================================================
        # Go 后端 API → go-backend:16080
        # ============================================================
        location /api/ {
            proxy_pass http://go-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # ============================================================
        # AI 服务 → ai-service:8001 (strip /ai/, prepend /api/)
        # 请求: /ai/v1/summary/summarize → http://ai-service/api/v1/summary/summarize
        # ============================================================
        location /ai/ {
            proxy_pass http://ai-service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
    }
}