name: CI/CD — Nginx Gateway

on:
  push:
    branches: [main, master]
    paths:
      - 'nginx/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'nginx/**'

env:
  SWR_REGISTRY: swr.ap-southeast-3.myhuaweicloud.com
  SWR_ORG: digital-finance-commercial
  IMAGE_NAME: nginx
  COMPOSE_FILE: docker-compose.infra.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          config: |
            [registry."docker.io"]
              mirrors = ["https://docker.m.daocloud.io", "https://docker.1panel.live"]

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Generate image tags
        id: meta
        run: |
          SHA_TAG="${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          LATEST_TAG="${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}:latest"
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login to SWR
        run: echo "${{ secrets.SWR_PASSWORD }}" | docker login ${{ env.SWR_REGISTRY }} -u ${{ secrets.SWR_USERNAME }} --password-stdin

      - name: Deploy
        run: |
          cp docker-compose.yml ${{ vars.DEPLOY_WORKSPACE }}/${{ env.COMPOSE_FILE }}
          cd ${{ vars.DEPLOY_WORKSPACE }}
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --pull always
