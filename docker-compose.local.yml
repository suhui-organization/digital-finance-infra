# =============================================================================
# 数字金融彩票 — 本地基础服务部署 (从源码构建)
# 只管理 postgres / redis / nginx，不包含任何应用服务
# 应用服务（go-backend / ai-service / admin / mobile）在各子工程独立编排
# 构建: docker compose -f docker-compose.local.yml build
# 启动: docker compose -f docker-compose.local.yml up -d
# =============================================================================
version: "3.8"

services:
  # ---------- 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: df-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_finance}
      POSTGRES_USER: ${POSTGRES_USER:-dfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfpass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfuser} -d ${POSTGRES_DB:-digital_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

  # ---------- 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: df-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

  # ---------- Nginx API 网关 (本地构建) ----------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: df-nginx:local
    container_name: df-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-16000}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

volumes:
  postgres_data:
    name: df-postgres-data

networks:
  df-network:
    name: digital-finance-network
    external: true
