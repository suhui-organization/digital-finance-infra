# =============================================================================
# 数字金融彩票 — 基础中间件（Infra）
# 职责范围: 仅管理数据库、缓存等基础设施服务
# 不含任何应用服务（go-backend/nginx/ai-service 等）
# =============================================================================
version: "3.8"

services:
  # ---------- 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: df-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_finance}
      POSTGRES_USER: ${POSTGRES_USER:-dfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfpass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../digital-finance-services/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfuser} -d ${POSTGRES_DB:-digital_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

  # ---------- 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: df-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

volumes:
  postgres_data:
    name: df-postgres-data

networks:
  df-network:
    name: digital-finance-network
    driver: bridge