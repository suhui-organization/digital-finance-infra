# =============================================================================
# 数字金融彩票 — 全量生产部署
# 镜像来源: 华为云 SWR (容器镜像服务)
# 使用方式: docker compose up -d
#
# 路由:
#   http://16000/api/*   → go-backend:16080
#   http://16000/ai/*    → ai-service:16081
# =============================================================================
version: "3.8"

services:
  # ---------- 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: df-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_finance}
      POSTGRES_USER: ${POSTGRES_USER:-dfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfpass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfuser} -d ${POSTGRES_DB:-digital_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

  # ---------- 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: df-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

  # ---------- Nginx API 反向代理 ----------
  nginx:
    image: swr.ap-southeast-3.myhuaweicloud.com/digital-finance-commercial/nginx:${TAG:-latest}
    container_name: df-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-16000}:80"
    depends_on:
      - go-backend
      - ai-service
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

volumes:
  postgres_data:
    name: df-postgres-data

networks:
  df-network:
    name: digital-finance-network
    driver: bridge