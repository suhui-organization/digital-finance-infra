# =============================================================================
# 数字金融彩票 — 基础服务（infrastructure）
# 只管理 postgres / redis / nginx，不包含任何应用服务
# 应用服务（go-backend / ai-service / admin / mobile）在各子工程独立编排
# 镜像来源: 华为云 SWR (容器镜像服务)
# 使用方式: docker compose up -d
# 数字金融彩票 — 基础中间件（Infra）
# 职责范围: 仅管理数据库、缓存等基础设施服务
# 不含任何应用服务（go-backend/nginx/ai-service 等）
# =============================================================================
version: "3.8"

services:
  # ---------- 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: df-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_finance}
      POSTGRES_USER: ${POSTGRES_USER:-dfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfpass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../digital-finance-services/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfuser} -d ${POSTGRES_DB:-digital_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

  # ---------- 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: df-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

  # ---------- Nginx API 反向代理 ----------
  # 将 /api/* → go-backend:16080, /ai/* → ai-service:16081
  # 应用服务由各自工程的 compose 独立启动，加入同一 network 即可被 Nginx 发现
  nginx:
    image: swr.ap-southeast-3.myhuaweicloud.com/digital-finance-commercial/nginx:${TAG:-latest}
    container_name: df-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-16000}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

volumes:
  postgres_data:
    name: df-postgres-data

networks:
  df-network:
    name: digital-finance-network
    driver: bridge