# =============================================================================
# 移动端前端部署 (Mobile Frontend)
# 镜像来源: 华为云 SWR (容器镜像服务)
# 前提: 基础服务已部署 (docker-compose.yml — 含 Nginx Gateway)
# 使用方式: docker compose -f docker-compose.mobile.yml up -d
# =============================================================================
version: "3.8"

services:
  # ---------- 移动端前端 ----------
  mobile:
    image: swr.ap-southeast-3.myhuaweicloud.com/digital-finance-commercial/mobile:${TAG:-latest}
    container_name: df-mobile
    restart: unless-stopped
    ports:
      - "${MOBILE_PORT:-16020}:16020"
    environment:
      NODE_ENV: production
      PORT: "16020"
      HOSTNAME: "0.0.0.0"
      # 通过 Nginx Gateway (nginx:80) 统一访问后端服务
      # Nginx Gateway 由主 docker-compose.yml 独立部署，不在此处重复定义
      API_GATEWAY_URL: "http://nginx:80"
      # 浏览器使用相对路径 /api/ 和 /ai/ 即可，无需设置 NEXT_PUBLIC_API_BASE_URL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - df-network

networks:
  df-network:
    name: digital-finance-network
    external: true
